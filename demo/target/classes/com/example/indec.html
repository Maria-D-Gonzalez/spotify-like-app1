<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #c2c2f9; color: #350523;"> 
    <h1>Music Player </h1>

  
    <p>Select an audio option: </p>
    <select id="track-select">
        <option value="wav/her-crop.wav">Her - Could've been</option>
        <option value="wav/Ketsa- Flushed.wav">Ketsa - Flushed</option>
        <option value="wav/biggie- crop.wav">biggie - crop</option>
        <option value="wav/dougie- crop.wav">dougie - crop</option>"

    </select>
    <button type="button" onclick="changeTrack()">Load Track</button>
    <button type="button" onclick="favoriteTrack()">Favorite Track</button>

    <br><br>
    <audio controls id="audio-player">
        <source src="wav/her-crop.wav" type="audio/mpeg">
        <source src="wav/Ketsa - Flushed.wav" type="audio/mpeg">
        <source src="wav/biggie- crop.wav" type="audio/mpeg">
        <source src="wav/dougie- crop.wav" type="audio/mpeg">
    </audio>

    <script>
        function changeTrack() {
            const select = document.getElementById('track-select');
            const player = document.getElementById('audio-player');
            const source = player.querySelector('source');
            source.src = select.value;
            player.load();
            player.play();
        }
    </script>
</body>
</html>
