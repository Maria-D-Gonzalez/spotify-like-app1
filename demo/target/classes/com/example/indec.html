<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #c2c2f9; color: #350523;"> 
    <h1>Music Player </h1>

  
    <p>Select an audio option: </p>
    <select id="track-select">
        <option value="wav/her-crop.wav">Her - Crop</option>
        <option value="wav/Ketsa- Flushed.mp3">Ketsa - Flushed</option>
        <option value="wav/Ketsa- Behind-in-Front.mp3">Ketsa - Behind in Front</option>
        <option value="wav/Ketsa- Them.mp3">Ketsa - Them</option>

    </select>
    <button type="button" onclick="changeTrack()">Load Track</button>

    <br><br>
    <audio controls id="audio-player">
        <source src="wav/her-crop.wav" type="audio/mpeg">
         <source src="wav/Ketsa - Flushed.mp3" type="audio/mpeg">
         <source src="wav/Ketsa- Behind-in-Front.mp3" type="audio/mpeg">
         <source src="wav/Ketsa- Them.mp3" type="audio/mpeg">
    </audio>

    <script>
        function changeTrack() {
            const select = document.getElementById('track-select');
            const player = document.getElementById('audio-player');
            const source = player.querySelector('source');
            source.src = select.value;
            player.load();
            player.play();
        }
    </script>
</body>
</html>
